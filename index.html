<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Youssef &amp; Sarah</title>
  <meta name="description" content="Youssef & Sarah — 19th August 2026, The St. Regis Cairo" />

  <!-- Social share preview -->
  <meta property="og:title" content="Youssef & Sarah" />
  <meta property="og:description" content="19th August 2026 · The St. Regis Cairo" />
  <meta property="og:image" content="poster.jpg" />
  <meta property="og:type" content="website" />

  <!-- Elegant serif to match the invitation theme -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600&display=swap" rel="stylesheet" />

  <style>
    :root {
      /* Palette pulled from the invitation reference */
      --blush:      #f4dbd6;
      --blush-deep: #e3b3ad;
      --rose:       #c98b86;
      --cream:      #fbf3ee;
      --ink:        #6b4a44;

      /* ↓↓↓ TWEAK ME ↓↓↓
         Vertical position of the "View the hotel" link over the video,
         as a % from the top of the video. Higher % = lower down.
         Aim it just above the pyramids, clear of the text. */
      --hotel-top: 82%;

      /* ↓↓↓ TWEAK ME ↓↓↓
         Transparency of the RSVP button's fill: 1 = solid, 0 = invisible.
         (The "RSVP" text stays fully opaque either way.) */
      --rsvp-bg-opacity: 0.8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      min-height: 100%;
      /* Themed backdrop fills the margins on wider screens */
      background: var(--cream);
      font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* Before the curtains open: pin the page to the top of the video and
       lock scrolling, so the closed curtains fill the screen and can't be
       scrolled past. Scrolling unlocks the moment the curtains open. */
    body:not(.opened) {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    /* Hide iOS Safari's built-in playback UI (the big play button and the
       control bar it overlays on inline / paused videos). Keeps the curtain
       reveal clean — no media controls appear over the video. */
    #film::-webkit-media-controls,
    #film::-webkit-media-controls-enclosure,
    #film::-webkit-media-controls-panel,
    #film::-webkit-media-controls-play-button,
    #film::-webkit-media-controls-start-playback-button {
      display: none !important;
      -webkit-appearance: none;
      opacity: 0 !important;
    }

    /* Scrollable stage: a centred, phone-width column so the tall
       invitation video shows in full and you scroll through it. */
    .stage {
      display: flex;
      justify-content: center;
    }

    /* Relative wrapper so the hotel link can be placed over the video
       and scroll along with it. */
    .frame {
      position: relative;
      width: 100%;
      max-width: 460px;        /* phone-width column, centred on desktop */
    }

    .frame video {
      width: 100%;
      height: auto;            /* keep the video's natural tall aspect */
      display: block;
    }

    /* ---- In-flow "View the hotel" link (sits over the video) ---- */
    .hotel-link {
      position: absolute;
      top: var(--hotel-top);
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      padding: 10px 22px;
      border-radius: 999px;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      color: var(--rose);
      font-family: inherit;
      font-size: 19px;
      letter-spacing: 0.06em;
      text-decoration: none;
      white-space: nowrap;
      box-shadow: 0 3px 14px rgba(107, 74, 68, 0.22);
      /* opacity delayed ~2s so buttons appear after the curtains start parting */
      transition: transform 0.2s ease, background 0.2s ease, opacity 1s ease 2s;
    }
    .hotel-link:active { transform: translate(-50%, -50%) scale(0.96); }

    /* ---- "tap to open" cue: fades in only once the curtains are
       held closed, disappears the moment the user opens them ---- */
    .hint {
      position: fixed;
      left: 50%;
      bottom: 16%;
      transform: translateX(-50%);
      z-index: 25;
      color: var(--rose);
      font-family: inherit;
      font-size: 17px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      text-shadow: 0 1px 10px rgba(251, 243, 238, 0.9);
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease;
    }
    body.waiting .hint {
      opacity: 0.9;
      animation: hintPulse 2.2s ease-in-out infinite;
    }
    body.opened .hint { opacity: 0; animation: none; }
    @keyframes hintPulse {
      0%, 100% { transform: translateX(-50%) scale(1);    opacity: 0.55; }
      50%      { transform: translateX(-50%) scale(1.05); opacity: 0.95; }
    }

    /* ---- Buttons stay hidden until the curtains open, then fade in ---- */
    .hotel-link, .rsvp { opacity: 0; pointer-events: none; }
    body.opened .hotel-link,
    body.opened .rsvp { opacity: 1; pointer-events: auto; }

    /* ---- Fixed RSVP button (always reachable, floats over the video) ---- */
    .rsvp {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: max(24px, env(safe-area-inset-bottom));
      z-index: 15;
      padding: 14px 42px;
      border-radius: 999px;
      border: none;
      background: rgba(201, 139, 134, var(--rsvp-bg-opacity));  /* --rose with adjustable alpha */
      color: var(--cream);
      font-family: inherit;
      font-size: 21px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      box-shadow: 0 4px 18px rgba(107, 74, 68, 0.38);
      /* opacity delayed ~2s so buttons appear after the curtains start parting */
      transition: transform 0.2s ease, background 0.2s ease, opacity 1s ease 2s;
    }
    .rsvp:active { transform: translateX(-50%) scale(0.96); }
  </style>
</head>
<body>

  <main class="stage">
    <div class="frame">
      <video
        id="film"
        src="video.mp4"
        poster="poster.jpg"
        autoplay
        muted
        loop
        playsinline
        webkit-playsinline
        preload="auto"
        x-webkit-airplay="deny"
        disablepictureinpicture
        disableremoteplayback>
      </video>

      <!-- In-flow link over the video. Link is set by the LINKS config in the script below. -->
      <a class="hotel-link" href="https://maps.app.goo.gl/5RRzzAYgnLHeBF5eA?g_st=ic" target="_blank" rel="noopener">
        Venue Location
      </a>
    </div>
  </main>

  <!-- Gentle "tap to open" cue (shown only while the curtains are held closed) -->
  <div class="hint" id="hint" aria-hidden="true">tap to open</div>

  <!-- Fixed RSVP button. Link is set by the LINKS config in the script below. -->
  <a class="rsvp" href="rsvp.html">RSVP</a>

  <script>
    /* ============================================================
       ↓↓↓ EDIT YOUR LINKS HERE ↓↓↓
       The two buttons point wherever you set these.
       ============================================================ */
    const LINKS = {
      hotel: "https://maps.app.goo.gl/5RRzzAYgnLHeBF5eA?g_st=ic",
      rsvp:  "rsvp.html",
    };

    document.querySelector('.hotel-link').href = LINKS.hotel;
    document.querySelector('.rsvp').href       = LINKS.rsvp;

    /* ↓↓↓ TWEAK ME ↓↓↓
       The curtains start opening around 7s. We let the video play in
       (muted), then hold it just before the reveal so the user's tap
       feels like it opens the curtains. */
    const PAUSE_AT   = 7;    // hold the closed curtains here, awaiting the tap
    const CUE_AT     = 2.5;  // seconds before the "tap to open" cue appears (autoplay OK)
    const CUE_AT_LPM = 0.6;  // ...and sooner when autoplay is blocked (e.g. Low Power Mode)

    const video = document.getElementById('film');
    let opened  = false;   // user has tapped to open the curtains
    let waiting = false;   // held closed at PAUSE_AT, awaiting the tap

    // Show the "tap to open" cue on a wall-clock timer, so it appears even
    // when autoplay is blocked (e.g. iOS Low Power Mode).
    const showCue = () => { if (!opened) document.body.classList.add('waiting'); };
    let cueTimer = setTimeout(showCue, CUE_AT * 1000);

    // iOS gives no direct "Low Power Mode" flag, but LPM blocks muted autoplay
    // — so a rejected play() means the curtains won't move on their own. Bring
    // the tap cue forward in that case.
    const onAutoplayBlocked = () => {
      if (opened || waiting) return;
      clearTimeout(cueTimer);
      cueTimer = setTimeout(showCue, CUE_AT_LPM * 1000);
    };

    // Nudge muted autoplay — but never resume while we're holding closed
    // (otherwise a tab-refocus would open the curtains without a tap).
    const tryPlay = () => {
      if (waiting) return;
      if (opened && video.ended) return;
      const p = video.play();
      if (p && typeof p.then === 'function') p.catch(onAutoplayBlocked);
    };
    tryPlay();
    document.addEventListener('visibilitychange', () => { if (!document.hidden) tryPlay(); });

    // Hold the curtains closed at PAUSE_AT until the user opens them.
    video.addEventListener('timeupdate', () => {
      if (!opened && video.currentTime >= PAUSE_AT) {
        waiting = true;
        video.pause();
      }
    });

    // A tap anywhere opens the curtains: unmute + resume (with sound).
    function openCurtains() {
      if (opened) return;
      opened  = true;
      waiting = false;
      clearTimeout(cueTimer);
      document.body.classList.remove('waiting');
      document.body.classList.add('opened');       // fade in buttons, hide cue
      // If autoplay never reached the hold point (e.g. iOS Low Power Mode),
      // jump straight to it so the tap opens the curtains right away.
      if (video.currentTime < PAUSE_AT) video.currentTime = PAUSE_AT;
      video.muted = false;
      video.volume = 1;
      video.play().catch(() => {});
    }
    document.addEventListener('click', openCurtains, { once: true });
  </script>
</body>
</html>
